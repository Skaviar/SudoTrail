<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 1120 560" fill="none">
  <title>Sudotrail — 3 million Sudoku puzzles with technique-based difficulty ratings</title>
  <desc>Easy, Medium, Hard and Expert puzzles, rated by the logical techniques used.</desc>
  <defs>
    <radialGradient id="paper" cx="1" cy="0" r="1.2">
      <stop stop-color="#e8edde"/>
      <stop offset="1" stop-color="#f5f5f0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" stroke="#315b4c" stroke-width="1.5"/>
    </pattern>
    <!-- Reuse the trail mark from web/icon.svg. -->
    <symbol id="trail" viewBox="0 0 32 32">
      <rect x="1" y="1" width="30" height="30" rx="7" fill="#273b34"/>
      <path d="M11 5v22M21 5v22M5 11h22M5 21h22" stroke="#f5f5f0" stroke-opacity=".18"/>
      <path d="M26 6H9a3 3 0 0 0-3 3v4a3 3 0 0 0 3 3h14a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3H6" stroke="#d4e3bf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="26" cy="6" r="2" fill="#273b34" stroke="#d4e3bf" stroke-width="1.6"/>
      <rect x="3" y="23" width="6" height="6" rx="1.5" fill="#d4e3bf"/>
    </symbol>
  </defs>
  <rect width="1120" height="560" fill="url(#paper)"/>
  <rect x="32" y="88" width="192" height="384" fill="url(#grid)" opacity=".17"/>
  <rect x="896" y="88" width="192" height="384" fill="url(#grid)" opacity=".17"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <g fill="#315b4c" opacity=".2" font-size="30" text-anchor="middle">
      <text x="64" y="132">3</text><text x="192" y="260">7</text><text x="128" y="388">2</text>
      <text x="928" y="196">8</text><text x="1056" y="324">4</text><text x="992" y="452">1</text>
    </g>
    <!-- Keep key content inside the centered square used by Kaggle thumbnails. -->
    <use href="#trail" x="430" y="76" width="46" height="46"/>
    <text x="488" y="111" fill="#273b34" font-size="39" font-weight="600" letter-spacing="-1">Sudotrail<tspan fill="#315b4c">.</tspan></text>
    <text x="560" y="240" fill="#273b34" text-anchor="middle" font-size="90" font-weight="500" letter-spacing="-3">3 million</text>
    <path d="M344 325h432" stroke="#d4e3bf" stroke-width="17"/>
    <text x="560" y="319" fill="#315b4c" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="66" letter-spacing="-1.5">Sudoku puzzles</text>
    <text x="560" y="382" fill="#526552" text-anchor="middle" font-size="25">Technique-based difficulty ratings</text>
    <g fill="#edf2e6" stroke="#b8c7ab">
      <rect x="304" y="426" width="116" height="42" rx="21"/>
      <rect x="432" y="426" width="128" height="42" rx="21"/>
      <rect x="572" y="426" width="116" height="42" rx="21"/>
      <rect x="700" y="426" width="116" height="42" rx="21"/>
    </g>
    <g fill="#315b4c" font-size="19" font-weight="500" text-anchor="middle">
      <text x="362" y="454">Easy</text><text x="496" y="454">Medium</text>
      <text x="630" y="454">Hard</text><text x="758" y="454">Expert</text>
    </g>
  </g>
</svg>
